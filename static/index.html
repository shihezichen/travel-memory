<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <!-- 明确声明只支持浅色：本站主体是高德的浅色地图（canvas/瓦片），
       浏览器的「强制深色」只会重写我们自己的 CSS 颜色、动不了地图，
       结果就是浅色地图上出现浅色图标。声明后浏览器不再自动变暗。 -->
  <meta name="color-scheme" content="light">
  <title>旅行记忆</title>
  <link rel="icon" href="/static/icon.svg?v=20260917v8" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png?v=20260917v8" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icon-180.png?v=20260917v8">
  <link rel="manifest" href="/static/site.webmanifest?v=20260917v8">
  <meta name="theme-color" content="#FF8A00">
  <link rel="stylesheet" href="/static/style.css?v=20260917v8">
  <script>
    window._AMapSecurityConfig = { securityJsCode: "__AMAP_SECURITY__" };
    window.MEDIA_BASE = "__MEDIA_BASE__";
    // 非空 = 媒体直接从浏览器传到 OSS，不走 frp 隧道（见 oss.py）。
    // 空 = 完整回退到原来的隧道分片上传，前端逻辑一行不变。
    window.OSS_DIRECT = "__OSS_DIRECT__";
  </script>
  <script src="https://webapi.amap.com/maps?v=__AMAP_VERSION__&key=__AMAP_KEY__&plugin=AMap.AutoComplete,AMap.Autocomplete,AMap.Geocoder,AMap.Driving,AMap.Geolocation"></script>
</head>
<body>

  <!-- 登录覆盖层 -->
  <div id="login-overlay" class="login-overlay hidden">
    <div class="login-box">
      <h2 class="login-brand"><img src="/static/icon.svg?v=20260917v8" alt="" width="44" height="44"><span>旅行记忆</span></h2>
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-auth="login" type="button"
                role="tab" aria-selected="true">登录</button>
        <button class="auth-tab" data-auth="register" type="button"
                role="tab" aria-selected="false">注册</button>
      </div>

      <!-- 两个面板等高：切 tab 时对话框不能跳大小（见 .auth-pane 的注释）。
           所以这里不直接切 form 的显隐，而是把每个 form 包进一个等高容器。 -->
      <div class="auth-panes">

        <div class="auth-pane" id="pane-login">
          <form id="login-form">
            <input type="text" id="login-username" class="login-input" placeholder="用户名" autocomplete="username">
            <input type="password" id="login-password" class="login-input" placeholder="密码" autocomplete="current-password">
            <button type="submit" class="btn btn-primary btn-block">登录</button>
          </form>

          <!-- 体验账号：账号密码写死在前端，点一下直接进，不用输任何东西。
               **只在登录 tab 出现** —— 注册 tab 上摆一个「一键登录体验账号」
               是自相矛盾的：人都要点注册了，还劝他先去逛演示。 -->
          <div class="demo-login">
            <button type="button" id="btn-demo-login" class="btn btn-block demo-btn">
              体验账号一键登录
            </button>
          </div>
        </div>

        <div class="auth-pane hidden" id="pane-register">
          <form id="register-form">
            <!-- 注册只要两样：用户名 + 密码。
                 昵称字段删掉了（2026-09-16）：注册是上手成本最高的一步，
                 任何一项都可能让人放弃。昵称进去以后再改不迟，后端本来就
                支持空 display_name（不给就回落成 username）。 -->
            <input type="text" id="reg-username" class="login-input" placeholder="用户名（登录用）" autocomplete="off">
            <input type="password" id="reg-password" class="login-input" placeholder="密码（至少 6 位）" autocomplete="new-password">
            <input type="password" id="reg-password2" class="login-input" placeholder="确认密码" autocomplete="new-password">
            <button type="submit" class="btn btn-primary btn-block">注册并进入</button>
          </form>
        </div>

      </div>

      <p id="login-error" class="login-error hidden"></p>
      __ICP_FOOTER__
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="/static/icon.svg?v=20260917v8" alt="" width="22" height="22"><span>旅行记忆</span></div>
      <select id="trip-select" class="trip-select"></select>
      <!-- 手机端用这一组替代下拉：上一个 / 当前行程（点开卡片选择器）/ 下一个 -->
      <div id="trip-nav" class="trip-nav">
        <button id="btn-trip-prev" class="trip-nav-arrow" aria-label="上一个行程">‹</button>
        <button id="trip-picker" class="trip-picker">
          <span class="trip-picker-name">载入中…</span>
          <span class="trip-picker-pos"></span>
        </button>
        <button id="btn-trip-next" class="trip-nav-arrow" aria-label="下一个行程">›</button>
      </div>
      <!-- 顶栏图标：Feather（MIT）线条几何内联成 SVG，**跟底部「更多」菜单里那套
           是同一份几何**（见 app.js 的 ICON），两处并排看才是一套东西。
           以前这里是 ＋ ✎ 🔄 🔗 ⬇️ ⬆️ 🧑💻 ⏻ ⋯ 一串 emoji/生僻字形：
           emoji 在各家系统上长相差异大、偏卡通，⏻(U+23FB) 更是很多字体里
           根本没有，会掉成豆腐块；而这几个动作（编辑/重算/分享/导入导出）
           恰恰都是"有通行画法"的，用线条图标一眼就认得。
           每个按钮都补 aria-label —— 只剩图形之后，读屏得靠它。 -->
      <!-- 搜图入口。**手机端也留着**（见 style.css 里 .topbtn.btn-search 的覆盖）：
           其余顶栏按钮在小屏上全收进「更多」，但搜索是高频的读操作，
           藏两层以后基本等于没有。模型没装时 JS 会把它整个摘掉。 -->
      <button id="btn-search" class="btn topbtn btn-icon btn-search hidden" title="按画面内容搜照片" aria-label="搜照片">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </button>
      <button id="btn-new-trip" class="btn topbtn">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>新行程</span>
      </button>
      <button id="btn-edit-trip" class="btn topbtn btn-icon" title="编辑当前行程" aria-label="编辑当前行程">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button id="btn-recalc" class="btn topbtn btn-icon" title="强制重新计算路线曲线（正常无需使用，路线会自动缓存）" aria-label="重新计算路线">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button id="btn-share-trip" class="btn topbtn btn-icon" title="分享当前行程（只读链接）" aria-label="分享当前行程">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
      <button id="btn-export-trip" class="btn topbtn btn-icon" title="导出行程为纯文本（便于手工编辑）" aria-label="导出行程">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button id="btn-import-trip" class="btn topbtn btn-icon" title="从纯文本导入行程" aria-label="导入行程">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <a id="btn-console" class="btn topbtn btn-icon" title="开发者控制台（API Key 管理）" aria-label="开发者控制台" href="/console" target="_blank" rel="noopener">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      </a>
      <button id="btn-logout" class="btn topbtn btn-icon" title="退出登录" aria-label="退出登录">
        <svg class="tbi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
      <button id="btn-more" class="btn more-btn btn-icon" title="更多操作" aria-label="更多操作">
        <svg class="tbi" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </header>
    <div class="userbar">
      <span id="current-user" class="current-user"></span>
      <span id="top-stats" class="top-stats" title="点击查看完整统计"></span>
    </div>

    <main class="layout">
      <div id="map" class="map">
        <button id="btn-layers" class="map-fab fab-layers" title="图层控制：景区 / 卫星 / 路况" aria-label="图层控制"></button>
        <div id="layer-panel" class="layer-panel hidden">
          <div class="layer-title">图层控制</div>
          <label class="layer-item"><input type="checkbox" id="lay-poi"> 景区景点</label>
          <label class="layer-item"><input type="checkbox" id="lay-satellite"> 卫星底图</label>
          <label class="layer-item"><input type="checkbox" id="lay-traffic"> 路况</label>
          <label class="layer-item" title="所有去过的地方"><input type="checkbox" id="lay-heatmap"> 足迹热力图</label>
          <label class="layer-item" title="各点的照片和视频，多图重叠"><input type="checkbox" id="lay-photos"> 照片视频</label>
          <label class="layer-item" title="每段路线中点上的公里数"><input type="checkbox" id="lay-mileage" checked> 里程标签</label>
          <label class="layer-item" title="路线上走过的国道/省道/县道编号，标在各自那一截路的中点"><input type="checkbox" id="lay-road" checked> 公路编号</label>
        </div>
        <button id="btn-map-fullscreen" class="map-fab fab-fullscreen" title="地图全屏" aria-label="地图全屏">⛶</button>
        <button id="btn-fit-view" class="map-fab fab-fit" title="全览：把整个行程收进视野" aria-label="全览整个行程">⤢</button>
        <button id="btn-locate" class="map-fab fab-locate" title="定位到我的位置" aria-label="定位到我的位置"></button>
        <button id="btn-panel-open" class="map-fab hidden mobile-only" title="展开详情" aria-label="展开详情">☰</button>
        <!-- 手机端：顶栏（logo 那行）和账号/统计条可以整体收起，把高度让给地图和列表。
             这枚小把手吊在地图上沿，收起后仍在原处，点一下再唤出来。 -->
        <button id="btn-chrome-toggle" class="chrome-toggle" type="button"
                title="收起顶部栏" aria-label="收起顶部栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg>
        </button>
        <button id="replay-launch" class="replay-launch hidden" title="轨迹回放：沿路线播放旅程动画" aria-label="轨迹回放">▶</button>
        <div id="replay-bar" class="replay-bar hidden">
          <button id="replay-toggle" class="replay-btn" title="轨迹回放：播放中点击=暂停，暂停中点击=继续，播完点击=重播">▶</button>
          <div class="replay-progress"><div id="replay-fill" class="replay-fill"></div><span id="replay-count" class="replay-count"></span></div>
          <span id="replay-name" class="replay-name"></span>
          <div class="replay-speed">
            <button type="button" id="replay-speed" class="spd active" title="点击切换播放速度">1x</button>
          </div>
          <button id="replay-close" class="replay-close" title="最小化回放条（不中断播放）">—</button>
        </div>
      </div>

      <div class="panel-resizer" title="拖拽调整面板高度" aria-label="拖拽调整面板高度">
        <button id="btn-panel-toggle" class="panel-toggle" title="收起面板" aria-label="收起面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="7 8 12 13 17 8"/><line x1="5" y1="17.5" x2="19" y2="17.5"/></svg></button>
      </div>

      <!-- 宽屏：面板右边缘上半部铺一条竖条，点它展开面板。
           和控制栏里那枚「收起」按钮同处右上角一带 —— 在哪点没的，就在哪点回来。
           竖条高 58vh 而不是整条右边缘，是为了不挡住右下角那堆地图浮动按钮。 -->
      <div id="panel-edge" class="panel-edge hidden" role="button" tabindex="-1"
           title="展开面板" aria-label="展开面板">
        <button class="panel-edge-btn" title="展开面板" aria-label="展开面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="12 8 7 13 12 18"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
      </div>

      <aside class="panel">
        <div class="tabs">
          <button class="tab active" data-tab="points">轨迹点</button>
          <button class="tab" data-tab="detail">点详情</button>
          <button class="tab" data-tab="albums">相册</button>
          <!-- 宽屏面板右上角这一簇：收起面板 / 一键铺满 / 一键还原。
               收起后原地换成 #panel-edge 那条展开竖条，位置对得上。 -->
          <div class="panel-ops wide-only">
            <button id="btn-panel-vis" class="panel-toggle panel-op" title="面板铺满整个窗口" aria-label="面板铺满整个窗口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><line x1="9.5" y1="4.5" x2="9.5" y2="19.5"/></svg></button>
            <button id="btn-panel-toggle-wide" class="panel-toggle panel-op" title="收起面板" aria-label="收起面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="8 7 13 12 8 17"/><line x1="17.5" y1="5" x2="17.5" y2="19"/></svg></button>
          </div>
          <span class="tab-indicator" aria-hidden="true"></span>
        </div>

        <!-- 三个 tab 页做成一条横向轨道，切换时整条平移，形成卡片轮播效果 -->
        <div class="view-track">
          <section id="points-view" class="view" aria-hidden="false">
            <ul id="point-list" class="point-list"></ul>
          </section>

          <section id="detail-view" class="view" aria-hidden="true">
            <div id="detail-empty" class="empty-hint">点击地图上的点查看详情</div>
            <div id="detail-body" class="hidden">
              <!-- 标题行把「名字 + 日期 + 编辑/删除」并成一行：
                   原来名字、日期经纬度、底部两个按钮各占一行，三行都是给图片让位的代价。
                   经纬度移到名字的 title 里（悬停/长按可见），日期跟在名字后面。 -->
              <div class="detail-head">
                <h3 id="detail-name"></h3>
                <span id="detail-date" class="detail-date"></span>
                <button id="btn-detail-play" class="detail-act" data-pw-icon="css" title="自动播放：随机选一张放大铺满，再换下一张" aria-label="自动播放这个地点的相片墙" aria-pressed="false"></button>
                <button id="btn-edit-point" class="detail-act" title="编辑轨迹点" aria-label="编辑轨迹点"></button>
                <button id="btn-del-point" class="detail-act danger" title="删除轨迹点" aria-label="删除轨迹点"></button>
              </div>
              <p id="detail-desc" class="detail-desc"></p>
              <!-- 上传入口做进网格最后一格的「＋」（见 buildMediaAddCell），
                   原来那条独占一行的按钮就省掉了，照片区域多出一整行 -->
              <input type="file" id="file-input" accept="image/*,video/*" multiple hidden>
              <div id="media-grid" class="media-grid"></div>
            </div>
          </section>

          <section id="albums-view" class="view" aria-hidden="true">
            <!-- 相册：扁平缩略图网格（类 iOS 照片）—— 类型筛选 / 时间排序 / 缩放 -->
            <div class="photo-toolbar">
              <div id="photo-filter" class="seg">
                <button class="seg-btn active" data-filter="all">全部</button>
                <button class="seg-btn" data-filter="photo">照片</button>
                <button class="seg-btn" data-filter="video">视频</button>
              </div>
              <span id="photo-count" class="photo-count"></span>
              <span class="photo-hint">滚轮缩放</span>
              <div class="photo-tools">
                <button id="btn-photo-play" class="icon-btn" title="自动播放：随机选一张放大铺满，再换下一张" aria-label="自动播放照片墙" aria-pressed="false">▶</button>
                <button id="btn-photo-sort" class="icon-btn" title="切换时间排序">↓ 新→旧</button>
                <button id="btn-photo-zoom-out" class="icon-btn" title="缩小（每行更多）">－</button>
                <button id="btn-photo-zoom-in" class="icon-btn" title="放大（每行更少）">＋</button>
              </div>
            </div>
            <div id="photo-grid" class="photo-grid"></div>
          </section>
        </div>

        <!-- 添加地点：面板内浮动加号按钮 -->
        <div id="add-point-bar">
          <button id="btn-add-point" class="btn-fab" title="添加地点">＋</button>
        </div>
      </aside>
    </main>
  </div>

  <!-- 媒体灯箱 -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-close" id="lightbox-close" role="button" tabindex="0"
       title="关闭" aria-label="关闭">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>
    <!-- 保存到本地。放在关闭按钮左边：右上角是灯箱里唯一稳定不被内容挤走的位置，
         照片和视频都用同一个入口，移动端 44px 触摸区。实际下载由服务端的
         Content-Disposition: attachment 促成（见 download.py），不靠 <a download>。 -->
    <button class="lightbox-download" id="lightbox-download" type="button"
            title="保存到本地" aria-label="保存到本地" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
    <!-- 视频的「下哪一档」菜单（复用播放器已拿到的 qualities，不再打一次接口） -->
    <div class="lb-download-menu hidden" id="lightbox-download-menu"></div>
    <div class="lightbox-prev" id="lightbox-prev">‹</div>
    <div class="lightbox-next" id="lightbox-next">›</div>
    <div class="lightbox-stage" id="lightbox-stage"></div>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <!-- 语义搜图：条件和结果在同一页。
       做成整屏覆盖层而不是模态框，是因为结果是一面照片墙 —— 墙要铺得开，
       弹窗那点宽度放不下。层级 1500：高于顶栏和面板，低于灯箱(2000)，
       这样从墙上点开大图时灯箱盖在它上面，关掉大图又回到原来的结果。 -->
  <div id="search-overlay" class="search-overlay hidden" aria-hidden="true">
    <div class="search-head">
      <button id="search-back" class="search-back" type="button" title="返回" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="search-box">
        <svg class="search-box-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <!-- type=search 而不是 text：手机输入法的回车键会变成「搜索」，
             iOS 还会自带一个清除叉。enterkeyhint 是给不认 type=search 的那些。 -->
        <input id="search-input" class="search-input" type="search" enterkeyhint="search"
               placeholder="描述画面，比如「海边落日」" autocomplete="off">
      </div>
      <button id="search-go" class="btn btn-primary search-go" type="button">搜索</button>
    </div>

    <div class="search-scope">
      <div class="search-scope-head">
        <span class="search-scope-title">搜索范围</span>
        <button id="search-scope-all" class="search-scope-act" type="button">全选</button>
        <button id="search-scope-cur" class="search-scope-act" type="button">只搜当前</button>
      </div>
      <div id="search-trips" class="search-trips"></div>
    </div>

    <div id="search-status" class="search-status"></div>
    <div id="search-grid" class="photo-grid search-grid"></div>
  </div>

  <!-- 模态框 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="modal-title"></h2>
      <form id="modal-form">
        <div id="modal-fields"></div>
        <div class="modal-actions">
          <button type="button" class="btn" id="btn-cancel">取消</button>
          <button type="submit" class="btn btn-primary">确定</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 完整统计弹窗 -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="stats-modal-title">行程统计</h2>
      <div id="stats-modal-body" class="stat-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="stats-modal-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 路线选择浮层（地图可视化，多方案颜色区分） -->
  <div id="route-chooser" class="route-chooser hidden">
    <div class="route-chooser-box">
      <h3>选择路线</h3>
      <p id="route-chooser-sub" class="route-chooser-sub"></p>
      <div id="route-chooser-list" class="route-chooser-list"></div>
      <div class="route-chooser-actions">
        <button type="button" class="btn" id="route-chooser-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="route-chooser-ok">确定</button>
      </div>
    </div>
  </div>

  <input type="file" id="import-file-input" accept=".json,.txt,application/json" hidden>

  __ICP_FOOTER__

  <script src="/static/common.js?v=20260917v8"></script>
  <script src="/static/app.js?v=20260917v8"></script>
</body>
</html>
