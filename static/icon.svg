<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="旅行记忆">
  <!-- 应用主图标：一条走过的路 + 落脚的地方。
       暖色渐变（橙→玫红）对应「记忆」，白色路线与定位针对应「旅行」。
       只用两种颜色、三个形状，缩到 16px 仍然认得出。
       路线末端和针尖之间刻意留一小段空隙：贴在一起时缩小后会糊成一坨。
       针中间的洞用同一条 userSpaceOnUse 渐变填充，和底色严丝合缝地对上。 -->
  <defs>
    <linearGradient id="tmg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#F5296E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tmg)"/>
  <!-- 走过的路：左下起点圆点 → 向右上蜿蜒 -->
  <path d="M15 51C22.5 50.5 19.5 42 26.5 40.5C31.5 39.4 32 35.5 34.5 33.5"
        fill="none" stroke="#fff" stroke-width="4.8"
        stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
  <circle cx="15" cy="51" r="4.4" fill="#fff"/>
  <!-- 落脚点：定位针 -->
  <path d="M43.5 9c6.2 0 11.2 5 11.2 11.2 0 8-11.2 18.6-11.2 18.6S32.3 28.2 32.3 20.2C32.3 14 37.3 9 43.5 9z" fill="#fff"/>
  <circle cx="43.5" cy="20.2" r="4.4" fill="url(#tmg)"/>
</svg>
