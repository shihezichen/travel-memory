<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- 明确声明只支持浅色：本站主体是高德的浅色地图（canvas/瓦片），
       浏览器的「强制深色」只会重写我们自己的 CSS 颜色、动不了地图，
       结果就是浅色地图上出现浅色图标。声明后浏览器不再自动变暗。 -->
  <meta name="color-scheme" content="light">
  <title>旅行记忆 · 分享</title>
  <link rel="icon" href="/static/icon.svg?v=20261016v1" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png?v=20261016v1" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icon-180.png?v=20261016v1">
  <link rel="manifest" href="/static/site.webmanifest?v=20261016v3">
  <meta name="theme-color" content="#FF8A00">
  <!-- 装到桌面后以独立窗口运行：iOS 认 apple-*，Android / 桌面认 manifest -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="旅行记忆">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- 安全区：网页侧只靠 CSS env(safe-area-inset-*)，而它在原生 WebView 壳里恒为 0；
     故声明 content="none" 明确告诉壳「网页处理不了，请注入 padding」。两端壳（Android WebView / 鸿蒙 ArkWeb）
     看到本标记不等于1 就会注入。iOS Safari 与 Chrome PWA 里 env() 正常，无需壳参与。 -->
  <link rel="stylesheet" href="/static/style.css?v=20261016v3">
  <script>
    window._AMapSecurityConfig = { securityJsCode: "__AMAP_SECURITY__" };
    window.MEDIA_BASE = "__MEDIA_BASE__";
  </script>
  <script src="https://webapi.amap.com/maps?v=__AMAP_VERSION__&key=__AMAP_KEY__&plugin=AMap.Driving,AMap.Geolocation"></script>
</head>
<body class="share-page">
  <div class="app">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="/static/icon.svg?v=20261016v1" alt="" width="22" height="22"><span>旅行记忆</span></div>
      <div class="share-title" id="share-title">载入中…</div>
    </header>
    <div class="userbar">
      <span class="current-user" id="share-meta"></span>
      <span id="top-stats" class="top-stats" title="点击查看完整统计"></span>
    </div>

    <main class="layout">
      <div id="map" class="map">
        <button id="btn-layers" class="map-fab fab-layers" title="图层控制：景区 / 卫星 / 路况" aria-label="图层控制"></button>
        <div id="layer-panel" class="layer-panel hidden">
          <div class="layer-title">图层控制</div>
          <label class="layer-item"><input type="checkbox" id="lay-poi"> 景区景点</label>
          <label class="layer-item"><input type="checkbox" id="lay-satellite"> 卫星底图</label>
          <label class="layer-item"><input type="checkbox" id="lay-traffic"> 路况</label>
          <label class="layer-item" title="本行程各点的照片和视频，多图重叠"><input type="checkbox" id="lay-photos"> 照片视频</label>
          <label class="layer-item" title="每段路线中点上的公里数"><input type="checkbox" id="lay-mileage" checked> 里程标签</label>
          <label class="layer-item" title="路线上走过的国道/省道/县道编号，标在各自那一截路的中点"><input type="checkbox" id="lay-road" checked> 公路编号</label>
        </div>
        <button id="btn-map-fullscreen" class="map-fab fab-fullscreen" title="地图全屏" aria-label="地图全屏">⛶</button>
        <button id="btn-fit-view" class="map-fab fab-fit" title="全览：把整个行程收进视野" aria-label="全览整个行程">⤢</button>
        <button id="btn-locate" class="map-fab fab-locate" title="定位到我的位置" aria-label="定位到我的位置"></button>
        <button id="btn-panel-open" class="map-fab hidden mobile-only" title="展开详情" aria-label="展开详情">☰</button>
        <button id="replay-launch" class="replay-launch hidden" title="轨迹回放：沿路线播放旅程动画" aria-label="轨迹回放">▶</button>
        <div id="replay-bar" class="replay-bar hidden">
          <button id="replay-toggle" class="replay-btn" title="轨迹回放：播放中点击=暂停，暂停中点击=继续，播完点击=重播">▶</button>
          <div class="replay-progress"><div id="replay-fill" class="replay-fill"></div><span id="replay-count" class="replay-count"></span></div>
          <span id="replay-name" class="replay-name"></span>
          <div class="replay-speed">
            <button type="button" id="replay-speed" class="spd active" title="点击切换播放速度">1x</button>
          </div>
          <button id="replay-close" class="replay-close" title="最小化回放条（不中断播放）">—</button>
        </div>
      </div>

      <div class="panel-resizer" title="拖拽调整面板高度" aria-label="拖拽调整面板高度">
        <button id="btn-panel-toggle" class="panel-toggle" title="收起面板" aria-label="收起面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="7 8 12 13 17 8"/><line x1="5" y1="17.5" x2="19" y2="17.5"/></svg></button>
      </div>

      <!-- 宽屏：面板右边缘上半部铺一条竖条，点它展开面板。
           和控制栏里那枚「收起」按钮同处右上角一带 —— 在哪点没的，就在哪点回来。
           竖条高 58vh 而不是整条右边缘，是为了不挡住右下角那堆地图浮动按钮。 -->
      <div id="panel-edge" class="panel-edge hidden" role="button" tabindex="-1"
           title="展开面板" aria-label="展开面板">
        <button class="panel-edge-btn" title="展开面板" aria-label="展开面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="12 8 7 13 12 18"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
      </div>

      <aside class="panel">
        <div class="tabs">
          <button class="tab active" data-tab="points">轨迹点</button>
          <button class="tab" data-tab="detail">点详情</button>
        <button class="tab" data-tab="albums">相册</button>
          <!-- 宽屏面板右上角这一簇：收起面板 / 一键铺满 / 一键还原。
               收起后原地换成 #panel-edge 那条展开竖条，位置对得上。 -->
          <div class="panel-ops wide-only">
            <button id="btn-panel-vis" class="panel-toggle panel-op" title="面板铺满整个窗口" aria-label="面板铺满整个窗口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><line x1="9.5" y1="4.5" x2="9.5" y2="19.5"/></svg></button>
            <button id="btn-panel-toggle-wide" class="panel-toggle panel-op" title="收起面板" aria-label="收起面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="8 7 13 12 8 17"/><line x1="17.5" y1="5" x2="17.5" y2="19"/></svg></button>
          </div>
          <span class="tab-indicator" aria-hidden="true"></span>
        </div>

        <!-- 三个 tab 页做成一条横向轨道，切换时整条平移，形成卡片轮播效果 -->
        <div class="view-track">
          <section id="points-view" class="view" aria-hidden="false">
            <ul id="point-list" class="point-list"></ul>
          </section>

          <section id="detail-view" class="view" aria-hidden="true">
            <div id="detail-empty" class="empty-hint">点击地图上的点查看详情</div>
            <div id="detail-body" class="hidden">
              <!-- 与主页面一致：名字 + 日期并成一行，经纬度收进 title；
                   来时路/即将去的里程改到地图上显示（见 updateSegLabels）。
                   分享页只读，所以没有编辑/删除图标。 -->
              <div class="detail-head">
                <h3 id="detail-name"></h3>
                <span id="detail-date" class="detail-date"></span>
                <button id="btn-detail-play" class="detail-act" data-pw-icon="css" title="自动播放：随机选一张放大铺满，再换下一张" aria-label="自动播放这个地点的相片墙" aria-pressed="false"></button>
              </div>
              <p id="detail-desc" class="detail-desc"></p>
              <div id="media-grid" class="media-grid"></div>
            </div>
          </section>

          <section id="albums-view" class="view" aria-hidden="true">
            <!-- 相册：扁平缩略图网格（与主页面一致）—— 类型筛选 / 时间排序 / 缩放 -->
            <div class="photo-toolbar">
              <div id="photo-filter" class="seg">
                <button class="seg-btn active" data-filter="all">全部</button>
                <button class="seg-btn" data-filter="photo">照片</button>
                <button class="seg-btn" data-filter="video">视频</button>
              </div>
              <span id="photo-count" class="photo-count"></span>
              <div class="photo-tools">
                <button id="btn-photo-play" class="icon-btn" title="自动播放：随机选一张放大铺满，再换下一张" aria-label="自动播放照片墙" aria-pressed="false">▶</button>
                <button id="btn-photo-sort" class="icon-btn" title="切换时间排序">↓ 新→旧</button>
                <button id="btn-photo-zoom-out" class="icon-btn" title="缩小（每行更多）">－</button>
                <button id="btn-photo-zoom-in" class="icon-btn" title="放大（每行更少）">＋</button>
              </div>
            </div>
            <div id="photo-grid" class="photo-grid"></div>
          </section>
        </div>
      </aside>
    </main>
  </div>

  <!-- 媒体灯箱 -->
  <!-- 行程统计弹窗（点顶部统计条打开），与主页面一致 -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="stats-modal-title">行程统计</h2>
      <div id="stats-modal-body" class="stat-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="stats-modal-close">关闭</button>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-close" id="lightbox-close" role="button" tabindex="0"
       title="关闭" aria-label="关闭">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>
    <!-- 保存到本地。放在关闭按钮左边：右上角是灯箱里唯一稳定不被内容挤走的位置，
         照片和视频都用同一个入口，移动端 44px 触摸区。实际下载由服务端的
         Content-Disposition: attachment 促成（见 download.py），不靠 <a download>。 -->
    <button class="lightbox-download" id="lightbox-download" type="button"
            title="保存到本地" aria-label="保存到本地" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
    <!-- 视频的「下哪一档」菜单（复用播放器已拿到的 qualities，不再打一次接口） -->
    <div class="lb-download-menu hidden" id="lightbox-download-menu"></div>
    <div class="lightbox-prev" id="lightbox-prev">‹</div>
    <div class="lightbox-next" id="lightbox-next">›</div>
    <div class="lightbox-stage" id="lightbox-stage"></div>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <script src="/static/shell-inset.js?v=20261016v3"></script>
  <script src="/static/common.js?v=20261016v3"></script>
  <script src="/static/share.js?v=20261016v1"></script>
</body>
</html>
