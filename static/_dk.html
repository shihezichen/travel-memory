<!doctype html><meta charset="utf-8"><style>html,body{margin:0}iframe{border:0}</style><body>
<iframe id="fr" style="width:390px;height:844px"></iframe>
<div id="out" style="font:12px monospace;white-space:pre">RUNNING</div>
<script>
const log=[];const f=document.getElementById('fr');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{try{const d=f.contentDocument,w=f.contentWindow;
await sleep(4000);
d.querySelector('#btn-demo-login').click(); await sleep(6000);
log.push('系统偏好 dark: '+w.matchMedia('(prefers-color-scheme: dark)').matches);
const g=(sel,n)=>{const e=d.querySelector(sel);if(!e){log.push(n+' 不存在');return;}
 const cs=w.getComputedStyle(e);log.push(n+' color='+cs.color+'  背景='+cs.backgroundColor);};
g('#btn-map-fullscreen','全屏钮 ');
g('#replay-launch','回放钮 ');
g('#btn-layers','图层钮 ');
d.querySelector('.panel-resizer .panel-toggle').click(); await sleep(700);
g('#btn-panel-open','详情钮 ');
log.push('面板背景: '+w.getComputedStyle(d.querySelector('.panel')).backgroundColor);
log.push('body 背景: '+w.getComputedStyle(d.body).backgroundColor);
document.getElementById('out').textContent=log.join('\n');
}catch(e){document.getElementById('out').textContent='异常: '+e.message;}};
f.src='/';
</script></body>
