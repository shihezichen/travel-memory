[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认不跑 E2E（需要拉起 uvicorn + Chrome，慢且依赖系统浏览器）。
# 跑 E2E：  .venv/bin/python -m pytest -m e2e
# 跑全量：  .venv/bin/python -m pytest -m ""
addopts = -q -ra --strict-markers -m "not e2e"

markers =
    unit: 纯函数 / 数据访问层单元测试（临时 DB，最快）
    api: FastAPI TestClient 集成测试（临时 DB + 临时上传目录）
    e2e: 端到端浏览器测试（拉起独立 uvicorn + 系统 Chrome，默认不跑）
    net: 需要真实外网的测试（默认不跑，用 -m net 显式打开）

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
